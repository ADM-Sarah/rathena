// Auto Heal
autobattle.autoheal: on

// Auto Potions
autobattle.autopotion: on

// Sit to rest
autobattle.sittorest: on

// Attack skills
autobattle.attackskill: on

// Buff skills
autobattle.buffskill: on

// Buff items
autobattle.buffitems: on

// Teleport option
autobattle.teleport: on

// Item pickup
autobattle.pickup: on

// Prefix player name with autoattack by [AI]
autobattle.prefixname: on

// Enable usage of hat effect when enabled, list of id is in autoattack.hpp - AA_HATEFFECTS
autobattle.hateffect: on

// Item detection area around player to pick up
//  Min 1 Max 30
autobattle.pdetection: 15

// Monster selection
autobattle.mselection: on

// Monster detection area around player
//  Min 1 Max 30
autobattle.mdetection: 15

// Set a hard delay for pick up - 1000 = 1000 ms
autobattle.pickup_delay: 750

// Min cell move
//  Min number of cell a player can move
//	Min 1 Max 20, min should be <= at max
autobattle.move_min: 3

// Max cell move
//  Max number of cell a player can move
//	Min 1 Max 20, max should be >= min
autobattle.move_max: 7

// Move type
//  0 = random move like a monster
//	1 = Move forward until it encounter a non walking cell ten it changes direction
//	2 = Move to a random location on a map, more natural walking but use more cpu to calculate the A* path
autobattle.movetype: 2

// Attempt to teleport if seeing a mvp/mini boss and player configure teleport
//  Min number of cell a player can move
autobattle.teleport_mvp: on

// Set a hard delay for attack skills (avoid skills with delay on client side only to be flooded) 100 = 1s
autobattle.askill_delay: 100

// Set a hard delay for buff skills (avoid skills with delay on client side only to be flooded) 100 = 1s
autobattle.bskill_delay: 100

// Ratio to apply on autoattack drop : 0 means there is no drop, 100 means it's normal, 200 is x2 etc..
autobattle.drop_ratio: 100

// Ratio to apply on autoattack exp : 0 means there is no exp, 100 means it's normal, 200 is x2 etc..
autobattle.exp_ratio: 100

// Allow in town (on mean enabled in town, off disabled)
autobattle.allow_town: off

// Allow in pvp
autobattle.allow_pvp: off

// Allow in gvg
autobattle.allow_gvg: off

// Allow in bg
autobattle.allow_bg: off

// Autoattack timer between each loop
// 500 = 0,5s = 500ms
autobattle.timer: 500

// Autoattack limitation by ip
// 0 = unlimit, 1 = 1 autoattack player by ip etc...
autobattle.iplimit: 0

// Autoattack limitation by gepard unique id (you need to uncomment 2 parts in autoattack.cpp
// where there is this string : Uncomment this if you have gepard and want to set a limit
// 0 = unlimit, 1 = 1 autoattack player by ip etc...
autobattle.gepardlimit: 0

//////////////////////////////////////////////////////////
// CUSTOMIZE FEATURE BY JAY
//////////////////////////////////////////////////////////

// Item IDs used as teleport items
fly_wing_ids: 12887,12323,601

// Item IDs that are consumed when using a teleport item
fly_wing_consume_ids: 12323,601

// When enabled (yes), items dropped by monsters killed via autoattack will drop at the player's location instead of the monster's location.
// This helps prevent loot from being ignored due to the player being out of range, teleporting, or moving away after the kill.
// When disabled (no), loot will drop at the monster's position as usual.
autobattle.loot_range: yes

// Battery System
// If you want to enable a battery system for using Auto-Battle
// 0 : Disabled
// 1 : Enabled
autobattle.battery_system: 1

// Battle Offline
// If you want to enable a battle offline
// 0 : Disabled
// 1 : Enabled
autobattle.battleoffline_system: 1

// Autoslave Teleport System
// Allows autoslave characters to automatically teleport closer to their party leader
// when they are too far away (e.g. more than 20 cells).
// Requires the slave to have either SP for Teleport skill or a Fly Wing item.
// If both are unavailable, the autoslave will report its inability to teleport.
// no : Disabled
// yes : Enabled
autoslave.teleport: yes

// VIP Ratio to apply on autoattack drop : 0 means there is no drop, 100 means it's normal, 200 is x2 etc..
autobattle.vip_drop_ratio: 80

// VIP Ratio to apply on autoattack exp : 0 means there is no exp, 100 means it's normal, 200 is x2 etc..
autobattle.vip_exp_ratio: 80