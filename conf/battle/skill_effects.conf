//--------------------------------------------------------------
// Custom Soul Destroyer / Cart Termination Freeze Settings
// Enables a custom Freeze chance for ASC_BREAKER and
// WS_CARTTERMINATION when card ID 4318 is equipped.
//--------------------------------------------------------------
// Note 1: *_active is a config switch (0 = disabled, 1 = enabled)
// Note 2: *_freeze uses 1/10000 chance
//         Example: 5 = 0.05%, 50 = 0.50%, 100 = 1.00%
// Note 3: *_freeze_duration is measured in seconds
//--------------------------------------------------------------

// Enable or disable Freeze effect for Soul Destroyer (ASC_BREAKER)
sd_freeze_active: 1

// Freeze chance for Soul Destroyer
// Uses 1/10000 rate: 5 = 0.05%
sd_freeze: 2000

// Freeze duration for Soul Destroyer in seconds
sd_freeze_duration: 4

// Enable or disable Freeze effect for Cart Termination (WS_CARTTERMINATION)
ct_freeze_active: 1

// Freeze chance for Cart Termination
// Uses 1/10000 rate: 5 = 0.05%
ct_freeze: 2000

// Freeze duration for Cart Termination in seconds
ct_freeze_duration: 4