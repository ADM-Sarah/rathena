###########################################################################
# Skill Adjustment Database
###########################################################################
#
# This database allows you to globally modify the damage of specific skills.
#
# Structure of Database:
#  - Skill                   Skill Name on skill_db.yml
#    Rate                    Damage modifier in percentage.
#
# Description:
#  Applies a global damage multiplier to the specified skill.
#  This modifier is applied AFTER all standard damage calculations.
#
# Rate:
#   0     = No change
#   100   = +100% damage (double damage)
#   -50   = -50% damage (half damage)
#   200   = +200% damage (triple damage)
#
# Notes:
#  - Affects ALL targets (Players, Monsters, Bosses)
#  - Affects ALL maps (PvP, WoE, PvE, Battlegrounds)
#  - Stacks with item bonuses, cards, and other modifiers
#  - Invalid skills will be ignored and show a warning
#
# Example:
#  - Skill: AS_SONICBLOW
#    Rate: 100
#
#  - Skill: MC_MAMMONITE
#    Rate: -50
#
###########################################################################

